name: Release

# Builds the app when a version tag is pushed and attaches a disk image to the
# GitHub release for that tag, creating a draft release if none exists yet.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  dmg:
    name: Build and attach the disk image
    runs-on: macos-26
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7

      - name: Derive the version from the tag
        run: echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"

      - name: Test
        run: scripts/coverage.sh

      - name: Build the universal app
        run: UNIVERSAL=1 scripts/build-app.sh

      - name: Make the disk image
        run: scripts/make-dmg.sh

      - name: Attach the disk image to the release
        run: |
          # The release is normally created right after the tag is pushed; give it a moment.
          for attempt in 1 2 3 4 5 6; do
            gh release view "$TAG" >/dev/null 2>&1 && break
            sleep 10
          done
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --draft --title "$TAG" --generate-notes
          gh release upload "$TAG" "dist/Pluck-$VERSION.dmg" --clobber
